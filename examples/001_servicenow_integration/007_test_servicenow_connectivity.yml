---
- name: Test ServiceNow connectivity
  hosts: localhost
  gather_facts: false
  vars:
    servicenow_instance: "{{ lookup('env', 'SERVICENOW_INSTANCE') }}"
    servicenow_user: "{{ lookup('env', 'SERVICENOW_USER') }}"
    servicenow_password: "{{ lookup('env', 'SERVICENOW_PASSWORD') }}"

  tasks:
    - name: Test connectivity
      uri:
        url: "{{ servicenow_instance }}/api/now/table/cmdb_ci"
        method: GET
        user: "{{ servicenow_user }}"
        password: "{{ servicenow_password }}"
        headers:
          Accept: "application/json"
      register: response

    - name: Print response
      ansible.builtin.debug:
        msg: "ServiceNow returned HTTP status {{ response.status }}."
