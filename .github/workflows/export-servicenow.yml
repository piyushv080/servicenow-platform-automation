name: Export ServiceNow Instance to GitHub

on:
  schedule:
    - cron: '0 8 */2 * *'    # Every 2 days at 8 AM UTC
  workflow_dispatch:
    inputs:
      update_set_name:
        description: 'Exact ServiceNow update set name to archive'
        required: true
        default: 'aws update set'
        type: string
      include_table_snapshots:
        description: 'Also export supplemental table snapshots (up to 100 records per table)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  export-servicenow:
    runs-on: ubuntu-latest
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "Piyush Verma"
          git config user.email "piyushv080@gmail.com"

      - name: Create export folders
        if: inputs.include_table_snapshots
        run: |
          mkdir -p catalog-builder/catalog-items
          mkdir -p catalog-builder/variable-sets
          mkdir -p flow-designer/flows
          mkdir -p flow-designer/subflows
          mkdir -p integration-hub/spokes
          mkdir -p client-scripts
          mkdir -p business-rules
          mkdir -p scripted-rest-api/endpoints

      - name: Export Catalog Items
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sc_cat_item?sysparm_fields=name,sys_id,short_description,description,category,active&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o catalog-builder/catalog-items/catalog-items-export.json || { echo 'ServiceNow response for catalog items (first 2000 bytes):'; head -c 2000 catalog-builder/catalog-items/catalog-items-export.json || true; exit 1; }
          echo "Catalog items exported"

      - name: Export Variable Sets
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/item_option_new_set?sysparm_fields=name,sys_id,short_description&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o catalog-builder/variable-sets/variable-sets-export.json || { echo 'ServiceNow response for variable sets (first 2000 bytes):'; head -c 2000 catalog-builder/variable-sets/variable-sets-export.json || true; exit 1; }
          echo "Variable sets exported"

      - name: Export Flow Designer Flows
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_hub_flow?sysparm_fields=name,sys_id,description,active,internal_name&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o flow-designer/flows/flows-export.json || { echo 'ServiceNow response for flows (first 2000 bytes):'; head -c 2000 flow-designer/flows/flows-export.json || true; exit 1; }
          echo "Flows exported"

      - name: Export Subflows
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_hub_subflow?sysparm_fields=name,sys_id,description,active,internal_name&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o flow-designer/subflows/subflows-export.json || { echo 'ServiceNow response for subflows (first 2000 bytes):'; head -c 2000 flow-designer/subflows/subflows-export.json || true; exit 1; }
          echo "Subflows exported"

      - name: Export Client Scripts
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_script_client?sysparm_fields=name,sys_id,script,table,type,active&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o client-scripts/client-scripts-export.json || { echo 'ServiceNow response for client scripts (first 2000 bytes):'; head -c 2000 client-scripts/client-scripts-export.json || true; exit 1; }
          echo "Client scripts exported"

      - name: Export Business Rules
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_script?sysparm_fields=name,sys_id,script,collection,when,active&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o business-rules/business-rules-export.json || { echo 'ServiceNow response for business rules (first 2000 bytes):'; head -c 2000 business-rules/business-rules-export.json || true; exit 1; }
          echo "Business rules exported"

      - name: Export Scripted REST APIs
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_ws_definition?sysparm_fields=name,sys_id,base_uri,active&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o scripted-rest-api/endpoints/rest-api-export.json || { echo 'ServiceNow response for scripted REST APIs (first 2000 bytes):'; head -c 2000 scripted-rest-api/endpoints/rest-api-export.json || true; exit 1; }
          echo "Scripted REST APIs exported"

      - name: Export Update Sets
        if: inputs.include_table_snapshots
        run: |
          curl --basic --noproxy '*' --retry 8 --retry-delay 10 --retry-max-time 180 --fail-with-body --show-error --silent -u "$SN_USERNAME:$SN_PASSWORD" \
            "https://${SN_INSTANCE}.service-now.com/api/now/table/sys_update_set?sysparm_fields=name,sys_id,description,state,release_date&sysparm_limit=100" \
            -H "Accept: application/json" \
            -o docs/update-sets-export.json || { echo 'ServiceNow response for update sets (first 2000 bytes):'; head -c 2000 docs/update-sets-export.json || true; exit 1; }
          echo "Update sets exported"

      - name: Export selected update set and customer update payloads
        env:
          UPDATE_SET_NAME: ${{ inputs.update_set_name || 'aws update set' }}
        run: python3 .github/scripts/export_update_set.py

      - name: Save export timestamp
        run: |
          echo "Last exported: $(date +'%Y-%m-%d %H:%M UTC')" > docs/last-export.txt

      - name: Commit and push exports
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "ServiceNow export - $(date +'%d %b %Y')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
